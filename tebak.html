<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tebak Isyarat - Kamus Bisindo</title>
    
    <!-- PWA & Favicon -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #1a1a1a;
            --header-bg: #ffffff;
            --border-color: #e0e0e0;
            --card-bg: #ffffff;
            --btn-bg: #ffffff;
            --btn-hover: #f1f3f5;
            --shadow: rgba(0,0,0,0.05);
            --subtext-color: #6c757d;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-blue: #3498db;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #f0f0f0;
            --header-bg: #1e1e1e;
            --border-color: #333333;
            --card-bg: #1e1e1e;
            --btn-bg: #2d2d2d;
            --btn-hover: #3a3a3a;
            --shadow: rgba(0,0,0,0.3);
            --subtext-color: #aaaaaa;
            --accent-blue: #2980b9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); color: var(--text-color); 
            display: flex; justify-content: center; min-height: 100vh; padding: 16px;
            transition: background 0.3s, color 0.3s;
        }

        .app-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; }

        /* Navigasi Atas */
        .top-bar { display: flex; align-items: center; justify-content: space-between; background-color: var(--header-bg); border: 1.5px solid var(--border-color); border-radius: 16px; padding: 14px 16px; box-shadow: 0 2px 10px var(--shadow); }
        .back-btn { display: inline-flex; align-items: center; background-color: var(--btn-bg); border: 1.5px solid var(--border-color); border-radius: 12px; padding: 8px 14px; font-size: 14px; font-weight: 700; color: var(--text-color); cursor: pointer; text-decoration: none; box-shadow: 0 2px 6px var(--shadow); transition: background 0.2s; }
        .back-btn:hover { background-color: var(--btn-hover); }
        .page-title { font-size: 16px; font-weight: 700; margin: 0; }

        /* Tampilan Menu Kategori */
        #setupView { display: flex; flex-direction: column; gap: 16px; }
        .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .cat-btn { background-color: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 16px; padding: 20px 16px; text-align: center; font-size: 14px; font-weight: 700; color: var(--text-color); cursor: pointer; box-shadow: 0 4px 12px var(--shadow); transition: transform 0.2s; display: flex; flex-direction: column; gap: 8px; align-items: center; text-transform: uppercase; position: relative; overflow: hidden; }
        .cat-btn:hover { transform: translateY(-3px); }
        .cat-count { font-size: 12px; color: var(--subtext-color); font-weight: 600; background: var(--bg-color); padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border-color); }
        .cat-btn.all { border-color: var(--accent-blue); background-color: rgba(52, 152, 219, 0.05); }
        
        /* Mini Progress Bar di Tombol Kategori */
        .mini-progress-bg { width: 100%; height: 6px; background-color: var(--border-color); border-radius: 6px; overflow: hidden; margin-top: 4px; }
        .mini-progress-fill { height: 100%; background-color: var(--accent-green); transition: width 0.3s; }
        .mini-progress-text { font-size: 10px; font-weight: 700; color: var(--accent-green); letter-spacing: 0.5px; }

        /* Tampilan Flashcard (Permainan) */
        #gameView { display: none; flex-direction: column; gap: 16px; }
        .flashcard { background-color: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 20px; padding: 24px 20px; text-align: center; box-shadow: 0 4px 16px var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 16px; min-height: 300px; justify-content: flex-start; }
        
        /* Progress Bar dalam Game */
        .progress-wrapper { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .progress-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: var(--subtext-color); text-transform: uppercase; letter-spacing: 1px; }
        .progress-bg { width: 100%; height: 10px; background-color: var(--border-color); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: var(--accent-green); border-radius: 10px; transition: width 0.4s ease-out; }
        .reset-btn { background: none; border: none; color: var(--accent-red); font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; padding: 4px; display: inline-flex; align-items: center; gap: 4px; }
        .reset-btn:hover { text-decoration: underline; }

        .word-prompt { font-size: 32px; font-weight: 800; color: var(--text-color); text-transform: uppercase; letter-spacing: -0.5px; margin: 20px 0; }
        
        .main-action-btn { background-color: var(--btn-bg); border: 2px solid var(--border-color); border-radius: 14px; padding: 14px 28px; font-size: 15px; font-weight: 700; color: var(--text-color); cursor: pointer; box-shadow: 0 2px 8px var(--shadow); transition: transform 0.2s; margin: auto 0; }
        .main-action-btn:hover { transform: translateY(-2px); }

        .answer-container { display: none; width: 100%; flex-direction: column; gap: 16px; border-top: 1px solid var(--border-color); padding-top: 20px; }
        .video-item { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .iframe-wrapper { width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); background-color: #000; }
        .iframe-wrapper iframe { width: 100%; height: 100%; border: none; }
        
        .video-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
        .action-btn { display: inline-flex; align-items: center; gap: 6px; background-color: var(--btn-bg); border: 1.5px solid var(--border-color); border-radius: 20px; padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--text-color); cursor: pointer; text-decoration: none; }
        
        .eval-section { display: none; flex-direction: column; align-items: center; gap: 12px; width: 100%; margin-top: 10px; }
        .eval-title { font-size: 15px; font-weight: 600; color: var(--text-color); }
        .eval-buttons { display: flex; gap: 12px; width: 100%; max-width: 320px; }
        .eval-btn { flex: 1; padding: 12px; font-size: 15px; font-weight: 700; border-radius: 12px; border: 1.5px solid var(--border-color); background-color: var(--btn-bg); color: var(--text-color); cursor: pointer; transition: transform 0.2s; }
        .eval-btn:hover { transform: translateY(-2px); }
        .eval-btn.yes:hover { background-color: rgba(46, 204, 113, 0.15); border-color: var(--accent-green); color: var(--accent-green); }
        .eval-btn.no:hover { background-color: rgba(231, 76, 60, 0.15); border-color: var(--accent-red); color: var(--accent-red); }
        
        .status-msg { color: var(--subtext-color); font-size: 15px; font-style: italic; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Navigasi Atas -->
        <div class="top-bar">
            <button class="back-btn" id="navBackBtn" onclick="handleBack()">← Ke Kamus</button>
            <h1 class="page-title">Tebak Isyarat</h1>
            <div style="width: 70px;"></div> <!-- Spacer -->
        </div>

        <!-- LAYAR MENU KATEGORI -->
        <div id="setupView">
            <p class="status-msg" id="loadingMsg">Memuat data...</p>
            <div id="categoryContainer" style="display: none;">
                <h3 style="font-size: 15px; margin-bottom: 12px; text-align: center;">Pilih Kategori untuk Ditebak:</h3>
                <div class="category-grid" id="categoryGrid"></div>
            </div>
        </div>

        <!-- LAYAR PERMAINAN (FLASHCARD) -->
        <div id="gameView">
            <div class="flashcard">
                
                <!-- Progress Bar Baru -->
                <div class="progress-wrapper">
                    <div class="progress-header">
                        <span id="currentCatLabel">Kategori</span>
                        <button class="reset-btn" onclick="resetCurrentCategory()" title="Mulai Ulang Kategori Ini">🔄 Reset</button>
                    </div>
                    <div class="progress-bg">
                        <div class="progress-fill" id="gameProgressFill" style="width: 0%;"></div>
                    </div>
                    <div class="progress-header" style="margin-top: 2px;">
                        <span id="progressTextDetail">0 / 0 Selesai</span>
                        <span id="progressPercentText" style="color: var(--accent-green);">0%</span>
                    </div>
                </div>
                
                <div id="cardContent">
                    <p class="status-msg">Menyiapkan kartu...</p>
                </div>

                <!-- Tombol Jawaban -->
                <button id="showAnswerBtn" class="main-action-btn" style="display: none;" onclick="showAnswer()">
                    👁️ Tampilkan Jawaban
                </button>

                <!-- Video Jawaban -->
                <div id="answerContainer" class="answer-container">
                    <div id="videoContainer"></div>
                </div>

                <!-- Evaluasi -->
                <div id="evalSection" class="eval-section">
                    <div class="eval-title">Apa kamu berhasil menebak isyaratnya?</div>
                    <div class="eval-buttons">
                        <button class="eval-btn no" onclick="nextCard(false)">👎 Lupa</button>
                        <button class="eval-btn yes" onclick="nextCard(true)">👍 Ingat</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        // Tema Sistem
        function initTheme() {
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.body.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                document.body.setAttribute('data-theme', e.matches ? 'dark' : 'light');
            });
        }
        initTheme();

        // Fitur Tombol ESC
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' || event.keyCode === 27) {
                handleBack();
            }
        });

        // Konstanta & Variabel
        const STORAGE_KEY = 'bisindo_tebak_multi';
        let dictionaryData = [];
        let categoriesMap = {};
        
        // Memuat Multi-Progres dari localStorage
        let savedProgress = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        
        // Status Permainan Saat Ini
        let isPlaying = false;
        let currentCategoryLabel = '';
        let deck = [];
        let totalCards = 0;
        let currentItem = null;
        
        const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSx8Kb-ezyZdVw46ruREAydDcWtquytEFrWomKc9zdMgOG0dGbElZz8NmVDMGpvgSJmY9fSDV18LVty/pub?output=csv';

        // Load Data Google Sheets
        Papa.parse(sheetCsvUrl, {
            download: true,
            header: false,
            skipEmptyLines: true,
            complete: function(results) {
                try {
                    dictionaryData = results.data
                        .filter(row => row && row.length > 0 && row[0] && row[0].trim() !== "" && row[1] && row[1].includes('<iframe'))
                        .map(row => {
                            let cat = (row.length > 2 && row[2] && row[2].trim() !== "") ? row[2].trim() : "Lainnya";
                            return { word: row[0].trim(), rawHtml: row[1].trim(), category: cat };
                        });
                    
                    if (dictionaryData.length > 0) {
                        processCategories();
                    } else {
                        document.getElementById('loadingMsg').innerText = 'Tidak ada data video yang ditemukan.';
                    }
                } catch (e) {
                    document.getElementById('loadingMsg').innerText = 'Gagal memproses data kamus.';
                }
            }
        });

        function processCategories() {
            categoriesMap = {};
            // Masukkan kategori "Semua Isyarat" sebagai data utama
            categoriesMap["Semua Isyarat"] = dictionaryData;

            dictionaryData.forEach(item => {
                if (!categoriesMap[item.category]) categoriesMap[item.category] = [];
                categoriesMap[item.category].push(item);
            });
            
            document.getElementById('loadingMsg').style.display = 'none';
            document.getElementById('categoryContainer').style.display = 'block';
            renderCategoryMenu();
        }

        // ==========================================
        // RENDER MENU KATEGORI & PROGRESS BAR MINI
        // ==========================================
        function renderCategoryMenu() {
            const grid = document.getElementById('categoryGrid');
            grid.innerHTML = '';

            const catNames = Object.keys(categoriesMap).sort((a, b) => {
                if (a === "Semua Isyarat") return -1; 
                if (b === "Semua Isyarat") return 1;
                if (a === "Lainnya") return 1; 
                if (b === "Lainnya") return -1;
                return a.localeCompare(b);
            });

            catNames.forEach(catName => {
                const dataArray = categoriesMap[catName];
                const count = dataArray.length;
                const btn = document.createElement('div');
                btn.className = catName === "Semua Isyarat" ? 'cat-btn all' : 'cat-btn';
