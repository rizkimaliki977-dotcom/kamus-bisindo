<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamus Bahasa Isyarat (Bisindo)</title>
    <style>
        :root {
            --bg-color: #f9f9f9;
            --text-color: #333;
            --card-bg: #ffffff;
            --title-color: #2c3e50;
            --accent-color: #3498db;
            --border-color: #ddd;
            --btn-hover: #f1f8ff;
            --shadow: rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --title-color: #ffffff;
            --accent-color: #58a6ff;
            --border-color: #333;
            --btn-hover: #262626;
            --shadow: rgba(0,0,0,0.5);
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            transition: background 0.3s, color 0.3s;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 { 
            color: var(--title-color); 
            margin: 0 auto;
            text-align: center;
        }

        .theme-toggle {
            background: none;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .theme-toggle:hover {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .search-container { margin: 20px 0; text-align: center; }
        input[type="text"] { 
            width: 100%; 
            max-width: 500px; 
            padding: 12px 20px; 
            font-size: 16px; 
            border: 2px solid var(--border-color); 
            background-color: var(--card-bg);
            color: var(--text-color);
            border-radius: 25px; 
            outline: none; 
            transition: border-color 0.3s; 
        }
        input[type="text"]:focus { border-color: var(--accent-color); }

        .nav-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
            align-items: center;
        }
        .alphabet-nav, .category-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }
        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }
        .filter-btn.reset {
            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
        }

        .result-item { 
            background: var(--card-bg); 
            margin-bottom: 15px; 
            border-radius: 10px; 
            box-shadow: 0 2px 4px var(--shadow); 
            overflow: hidden; 
            border: 1px solid var(--border-color);
        }
        
        .word-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .word-btn { 
            flex-grow: 1;
            text-align: left; 
            background: none; 
            border: none; 
            padding: 15px 20px; 
            font-size: 18px; 
            font-weight: bold; 
            text-transform: capitalize; 
            color: var(--title-color); 
            cursor: pointer; 
            transition: background 0.2s; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .word-btn:hover { background-color: var(--btn-hover); }
        
        .word-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .category-badge {
            font-size: 11px;
            background-color: rgba(52, 152, 219, 0.15);
            color: var(--accent-color);
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: normal;
        }

        .share-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px 15px;
            font-size: 16px;
            color: #7f8c8d;
            transition: color 0.2s;
        }
        .share-btn:hover { color: var(--accent-color); }

        .arrow-icon {
            font-size: 14px;
            color: #95a5a6;
            transition: transform 0.3s;
            margin-left: 10px;
        }
        .word-btn.active .arrow-icon { 
            transform: rotate(180deg); 
            color: var(--accent-color); 
        }
        
        .video-container { display: none; padding: 0 20px 20px 20px; flex-wrap: wrap; justify-content: center; gap: 20px; border-top: 1px solid var(--border-color); margin-top: 10px; padding-top: 15px; }
        
        .video-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 560px; }
        
        .video-header-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
            margin-bottom: 8px;
        }

        .video-label { font-size: 13px; color: #e67e22; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        .timestamp-badge {
            background-color: rgba(230, 126, 34, 0.15);
            color: #e67e22;
            border: 1px solid rgba(230, 126, 34, 0.3);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .timestamp-badge:hover {
            background-color: #e67e22;
            color: white;
        }

        .video-wrapper iframe { width: 100%; max-width: 560px; height: 315px; border-radius: 8px; box-shadow: 0 4px 8px var(--shadow); border: none; }
        
        .loading { text-align: center; color: #7f8c8d; font-style: italic; margin-top: 20px; }

        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 10px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body data-theme="light">

    <div class="header-container">
        <div style="width: 85px;"></div>
        <h1>Kamus Bisindo</h1>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Gelap</button>
    </div>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Cari kosakata atau kalimat..." onkeyup="searchWord()">
    </div>

    <div class="nav-section">
        <div class="category-nav" id="categoryNav"></div>
        <div class="alphabet-nav" id="alphabetNav"></div>
    </div>

    <div id="results">
        <p class="loading">Memuat data kamus...</p>
    </div>

    <div id="toast">Tautan berhasil disalin ke clipboard!</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        let dictionaryData = [];
        let activeLetter = '';
        let activeCategory = 'Semua';

        const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSx8Kb-ezyZdVw46ruREAydDcWtquytEFrWomKc9zdMgOG0dGbElZz8NmVDMGpvgSJmY9fSDV18LVty/pub?output=csv'; 

        const categoryRules = [
            { name: 'Kata Kerja', keywords: ['makan', 'minum', 'tidur', 'jalan', 'lari', 'duduk', 'bangun', 'pergi', 'datang', 'tinggal', 'kuliah', 'belajar', 'baca', 'tulis'] },
            { name: 'Kata Sifat / Karakter', keywords: ['ganteng', 'cantik', 'baik', 'sombong', 'lapar', 'senang', 'sedih', 'marah', 'besar', 'kecil', 'tinggi', 'pendek'] },
            { name: 'Kata Benda', keywords: ['buku', 'meja', 'kursi', 'rumah', 'mobil', 'motor', 'pakaian', 'baju', 'tas', 'penghapus', 'barang', 'toilet', 'wc'] },
            { name: 'Kata Tanya', keywords: ['apa', 'siapa', 'dimana', 'di mana', 'kapan', 'bagaimana', 'mengapa', 'berapa'] },
            { name: 'Keluarga', keywords: ['ayah', 'ibu', 'bapak', 'orang tua', 'kakak', 'adik', 'anak', 'keluarga', 'nenek', 'kakek', 'paman', 'bibi'] },
            { name: 'Waktu', keywords: ['pagi', 'siang', 'sore', 'malam', 'hari', 'senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu', 'minggu', 'bulan', 'tahun', 'kemarin', 'besok'] },
            { name: 'Hewan', keywords: ['kucing', 'anjing', 'burung', 'ikan', 'ayam', 'sapi', 'kuda', 'harimau', 'monyet', 'ular'] },
            { name: 'Pendidikan', keywords: ['sekolah', 'guru', 'murid', 'siswa', 'kampus', 'kuliah', 'ujian', 'kelas'] },
            { name: 'Tempat / Bangunan', keywords: ['gedung', 'rumah', 'pasar', 'toko', 'rumah sakit', 'jalan', 'kota', 'desa'] },
            { name: 'Kuliner / Makanan', keywords: ['makan', 'minum', 'nasi', 'kuliner', 'makanan', 'lapar', 'haus', 'roti', 'buah'] }
        ];

        function assignCategories(word) {
            let cats = [];
            let lowerWord = word.toLowerCase().trim();
            let wordsList = lowerWord.split(/\s+/);

            if (lowerWord.includes('?') || lowerWord.includes('.') || wordsList.length > 2) {
                cats.push('Contoh Kalimat');
            }

            categoryRules.forEach(rule => {
                if (rule.name !== 'Contoh Kalimat') {
                    for (let kw of rule.keywords) {
                        let isMatch = wordsList.includes(kw) || lowerWord === kw || lowerWord.includes(' ' + kw + ' ');
                        if (isMatch) {
                            if (!cats.includes(rule.name)) cats.push(rule.name);
                            break;
                        }
                    }
                }
            });

            if (cats.length === 0) {
                cats.push('Umum');
            }
            return cats;
        }

        function setupNavs() {
            const catNav = document.getElementById('categoryNav');
            let catHtml = '<button class="filter-btn active" onclick="filterByCategory(\'Semua\')">Semua Topik</button>';
            categoryRules.forEach(rule => {
                catHtml += '<button class="filter-btn" onclick="filterByCategory(\'' + rule.name + '\')">' + rule.name + '</button>';
            });
            catHtml += '<button class="filter-btn" onclick="filterByCategory(\'Umum\')">Umum</button>';
            catNav.innerHTML = catHtml;

            const alphNav = document.getElementById('alphabetNav');
            let alphHtml = '<button class="filter-btn reset" onclick="filterByLetter(\'\')">Semua Huruf</button>';
            for (let i = 0; i < 26; i++) {
                let char = String.fromCharCode(65 + i);
                alphHtml += '<button class="filter-btn" id="btn-' + char + '" onclick="filterByLetter(\'' + char + '\')">' + char + '</button>';
            }
            alphNav.innerHTML = alphHtml;
        }

        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeBtn');
            if (body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
                btn.innerText = '☀️ Terang';
            } else {
                body.setAttribute('data-theme', 'light');
                btn.innerText = '🌙 Gelap';
            }
        }

        Papa.parse(sheetCsvUrl, {
            download: true,
            header: false,
            skipEmptyLines: true,
            complete: function(results) {
                try {
                    dictionaryData = results.data
                        .filter(row => row && row.length > 0 && row[0] && row[0].trim() !== "")
                        .map(row => {
                            let word = row[0].trim();
                            let rawHtml = (row.length > 1 && row[1]) ? row[1].trim() : "";
                            return {
                                word: word,
                                rawHtml: rawHtml,
                                categories: assignCategories(word)
                            };
                        });
                    
                    setupNavs();
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    const sharedWord = urlParams.get('kata');
                    if (sharedWord) {
                        document.getElementById('searchInput').value = sharedWord;
                    }

                    applyFilters(); 
                } catch (e) {
                    document.getElementById('results').innerHTML = '<p class="loading" style="color:red;">Terjadi kesalahan saat memproses data: ' + e.message + '</p>';
                }
            },
            error: function(err) {
                document.getElementById('results').innerHTML = '<p class="loading" style="color:red;">Gagal mengunduh data dari Google Sheets. Pastikan link benar dan sudah di-Publish.</p>';
            }
        });

        function searchWord() {
            activeLetter = '';
            updateActiveButtons();
            applyFilters();
        }

        function filterByLetter(letter) {
            activeLetter = letter;
            document.getElementById('searchInput').value = '';
            updateActiveButtons();
            applyFilters();
        }

        function filterByCategory(category) {
            activeCategory = category;
            updateActiveButtons();
            applyFilters();
        }

        function updateActiveButtons() {
            document.querySelectorAll('.alphabet-nav .filter-btn').forEach(btn => {
                if ((activeLetter === '' && btn.innerText === 'Semua Huruf') || btn.innerText === activeLetter) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            document.querySelectorAll('.category-nav .filter-btn').forEach(btn => {
                if (btn.innerText === activeCategory) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            const filteredData = dictionaryData.filter(item => {
                const wordLower = item.word.toLowerCase();
                
                const matchesQuery = wordLower.includes(query);
                const matchesLetter = activeLetter === '' || item.word.toUpperCase().startsWith(activeLetter);
                const matchesCategory = activeCategory === 'Semua' || item.categories.includes(activeCategory);

                return matchesQuery && matchesLetter && matchesCategory;
            });

            displayResults(filteredData);
        }

        function shareWord(word, event) {
            event.stopPropagation();
            const baseUrl = window.location.origin + window.location.pathname;
            const shareUrl = baseUrl + '?kata=' + encodeURIComponent(word);

            if (navigator.clipboard) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showToast();
                }).catch(() => {
                    prompt("Salin tautan ini:", shareUrl);
                });
            } else {
                prompt("Salin tautan ini:", shareUrl);
            }
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function replayVideo(iframeElement, seconds) {
            let src = iframeElement.src;
            src = src.replace(/&amp;start=\d+/, '').replace(/\?start=\d+/, '');
            let separator = src.includes('?') ? '&' : '?';
            iframeElement.src = src + separator + 'start=' + seconds + '&autoplay=1';
        }

        function formatSeconds(totalSeconds) {
            let mins = Math.floor(totalSeconds / 60);
            let secs = totalSeconds % 60;
            let mStr = mins < 10 ? '0' + mins : mins;
            let sStr = secs < 10 ? '0' + secs : secs;
            return mStr + ':' + sStr;
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = ''; 

            if (data.length === 0) {
                resultsDiv.innerHTML = '<p class="loading">Kosakata atau kalimat tidak ditemukan.</p>';
                return;
            }

            const maxDisplay = 50;
            const dataToDisplay = data.slice(0, maxDisplay);

            dataToDisplay.forEach(item => {
                const word = item.word;
                let rawHtml = item.rawHtml;
                
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = rawHtml;
                const iframes = tempDiv.getElementsByTagName('iframe');
                
                let finalEmbedHtml = "";

                if (iframes.length > 0) {
                    for (let i = 0; i < iframes.length; i++) {
                        let label = iframes.length > 1 ? 'Variasi Isyarat ' + (i + 1) : 'Video Isyarat';
                        
                        let iframeSrc = iframes[i].getAttribute('src') || '';
                        let startMatch = iframeSrc.match(/[?&]start=(\d+)/);
                        let seconds = startMatch ? parseInt(startMatch[1]) : 0;
                        let timeFormatted = formatSeconds(seconds);

                        let timestampBadgeHtml = seconds > 0 
                            ? '<button class="timestamp-badge" onclick="let iframe = this.closest(\'.video-wrapper\').querySelector(\'iframe\'); replayVideo(iframe, ' + seconds + ');" title="Putar ulang dari detik ke-' + seconds + '">⏱️ ' + timeFormatted + '</button>'
                            : '';

                        finalEmbedHtml += '<div class="video-wrapper">' +
                            '<div class="video-header-info">' +
                                '<span class="video-label">' + label + '</span>' +
                                timestampBadgeHtml +
                            '</div>' +
                            iframes[i].outerHTML +
                        '</div>';
                    }
                } else if (rawHtml !== "") {
                    finalEmbedHtml = '<p style="padding:15px; color:#e74c3c;">Teks terdeteksi, namun tidak ditemukan format &lt;iframe&gt; YouTube yang valid.</p>';
                } else {
                    finalEmbedHtml = '<p style="padding:15px; color:#7f8c8d;">Belum ada video untuk isyarat ini.</p>';
                }

                const itemDiv = document.createElement('div');
                itemDiv.className = 'result-item';
                
                const headerDiv = document.createElement('div');
                headerDiv.className = 'word-header';

                const btn = document.createElement('button');
                btn.className = 'word-btn';
                
                let badgesHtml = item.categories.map(cat => '<span class="category-badge">' + cat + '</span>').join(' ');
                btn.innerHTML = '<div class="word-info"><span>' + word + '</span> ' + badgesHtml + '</div> <span class="arrow-icon">▼</span>';

                const shareBtn = document.createElement('button');
                shareBtn.className = 'share-btn';
                shareBtn.innerHTML = '🔗';
                shareBtn.title = 'Salin link kosakata ini';
                shareBtn.onclick = (e) => shareWord(word, e);

                headerDiv.appendChild(btn);
                headerDiv.appendChild(shareBtn);

                const videoDiv = document.createElement('div');
                videoDiv.className = 'video-container';

                btn.onclick = function() {
                    if (videoDiv.style.display === 'none' || videoDiv.style.display === '') {
                        if (videoDiv.innerHTML === '') {
                            videoDiv.innerHTML = finalEmbedHtml;
                        }
                        videoDiv.style.display = 'flex';
                        btn.classList.add('active');
                    } else {
                        videoDiv.style.display = 'none';
                        btn.classList.remove('active');
                        videoDiv.innerHTML = ''; 
                    }
                };

                itemDiv.appendChild(headerDiv);
                itemDiv.appendChild(videoDiv);
                resultsDiv.appendChild(itemDiv);
            });

            if(data.length > maxDisplay) {
                 const moreMsg = document.createElement('p');
                 moreMsg.className = 'loading';
                 moreMsg.innerText = 'Menampilkan ' + maxDisplay + ' dari ' + data.length + ' hasil. Ketik lebih spesifik atau gunakan filter di atas.';
                 resultsDiv.appendChild(moreMsg);
            }
        }
    </script>
</body>
</html>
