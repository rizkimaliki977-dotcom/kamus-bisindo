<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kursus Isyarat - Kamus Bisindo</title>
    <link rel="icon" type="image/png" href="icon.png">
    <meta name="theme-color" content="#1a1a1a">
    
    <style>
        :root {
            --bg-color: #f8f9fa; --text-color: #1a1a1a; --header-bg: #ffffff;
            --border-color: #e0e0e0; --card-bg: #ffffff; --btn-bg: #ffffff;
            --btn-hover: #f1f3f5; --shadow: rgba(0,0,0,0.05); --subtext-color: #6c757d;
            --accent-green: #2ecc71; --accent-red: #e74c3c; --accent-blue: #3498db; --star-color: #f1c40f;
        }

        [data-theme="dark"] {
            --bg-color: #121212; --text-color: #f0f0f0; --header-bg: #1e1e1e;
            --border-color: #333333; --card-bg: #1e1e1e; --btn-bg: #2d2d2d;
            --btn-hover: #3a3a3a; --shadow: rgba(0,0,0,0.3); --subtext-color: #aaaaaa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
        .app-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; }

        /* Navigasi */
        .top-bar { display: flex; align-items: center; justify-content: space-between; background-color: var(--header-bg); border: 1.5px solid var(--border-color); border-radius: 16px; padding: 14px 16px; box-shadow: 0 2px 10px var(--shadow); }
        .back-btn { background-color: var(--btn-bg); border: 1.5px solid var(--border-color); border-radius: 12px; padding: 8px 14px; font-weight: 700; color: var(--text-color); cursor: pointer; text-decoration: none; }
        .page-title { font-size: 16px; font-weight: 700; margin: 0; }

        /* Peta Level (Roadmap) */
        .level-grid { display: flex; flex-direction: column; gap: 16px; padding: 20px 0; align-items: center; }
        .level-btn { width: 100%; max-width: 300px; padding: 20px; border-radius: 20px; border: 2px solid var(--border-color); background: var(--card-bg); font-size: 18px; font-weight: 800; cursor: pointer; transition: transform 0.2s; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 12px var(--shadow); color: var(--text-color); }
        .level-btn.unlocked { border-color: var(--accent-blue); background-color: rgba(52, 152, 219, 0.05); }
        .level-btn.unlocked:hover { transform: translateY(-3px); }
        .level-btn.locked { opacity: 0.6; cursor: not-allowed; background: var(--bg-color); }

        /* Layout Permainan Umum */
        .play-card { background-color: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 4px 16px var(--shadow); display: flex; flex-direction: column; gap: 16px; min-height: 400px; }
        
        /* Progress Bar */
        .progress-wrapper { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .progress-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--subtext-color); text-transform: uppercase; }
        .progress-bg { width: 100%; height: 10px; background-color: var(--border-color); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: var(--accent-blue); transition: width 0.3s; }

        /* Flashcard Elements */
        .word-prompt { font-size: 32px; font-weight: 800; margin: 30px 0; }
        .main-btn { background-color: var(--btn-bg); border: 2px solid var(--border-color); border-radius: 14px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; color: var(--text-color); }
        .eval-buttons { display: flex; gap: 12px; width: 100%; }
        .eval-btn { flex: 1; padding: 14px; font-size: 15px; font-weight: 700; border-radius: 12px; border: 1.5px solid var(--border-color); background: var(--btn-bg); cursor: pointer; color: var(--text-color); }

        /* Kuis Elements */
        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: var(--btn-bg); border: 2px solid var(--border-color); border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; text-align: left; display: flex; justify-content: space-between; color: var(--text-color); }
        .option-btn.correct { background-color: rgba(46, 204, 113, 0.15); border-color: var(--accent-green); color: var(--accent-green); }
        .option-btn.wrong { background-color: rgba(231, 76, 60, 0.15); border-color: var(--accent-red); color: var(--accent-red); }
        .option-btn.disabled { opacity: 0.5; pointer-events: none; }

        /* Video Container */
        .iframe-wrapper { width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); background: #000; }
        .iframe-wrapper iframe { width: 100%; height: 100%; border: none; }
        .video-actions { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
        .action-btn { background: var(--btn-bg); border: 1.5px solid var(--border-color); border-radius: 20px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text-color); }

        /* Result Screen */
        .stars-container { font-size: 50px; letter-spacing: 5px; margin: 20px 0; color: var(--border-color); }
        .stars-container.s1 { color: var(--star-color); } /* Nanti diatur via JS untuk warna bintang */
        .score-text { font-size: 18px; font-weight: 700; color: var(--subtext-color); }
        .result-title { font-size: 24px; font-weight: 800; }
        .next-btn { background: var(--accent-blue); color: white; border: none; border-radius: 16px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 20px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Navigasi -->
        <div class="top-bar">
            <button class="back-btn" onclick="handleBack()">← <span id="backText">Menu Utama</span></button>
            <h1 class="page-title" id="headerTitle">Peta Kursus</h1>
            <div style="width: 70px;"></div>
        </div>

        <!-- VIEW 1: PETA LEVEL -->
        <div id="mapView">
            <p id="loadingMsg" style="text-align:center; padding: 20px;">Memuat data level...</p>
            <div class="level-grid" id="levelGrid"></div>
        </div>

        <!-- VIEW 2: FLASHCARD -->
        <div id="flashcardView" class="play-card hidden">
            <div class="progress-wrapper">
                <div class="progress-header"><span>Fase 1: Belajar</span><span id="fcProgressTxt">0%</span></div>
                <div class="progress-bg"><div class="progress-fill" id="fcProgressFill" style="width: 0%;"></div></div>
            </div>
            
            <div id="fcContent">
                <div class="word-prompt" id="fcWord">KATA</div>
            </div>
            
            <button id="fcShowAnswerBtn" class="main-btn" onclick="fcShowAnswer()">👁️ Tampilkan Jawaban</button>
            
            <div id="fcAnswerSection" class="hidden">
                <div id="fcVideoContainer"></div>
                <h3 style="font-size: 14px; margin: 16px 0 8px 0;">Apakah kamu ingat gerakannya?</h3>
                <div class="eval-buttons">
                    <button class="eval-btn" style="color: var(--accent-red);" onclick="fcNextCard(false)">👎 Lupa</button>
                    <button class="eval-btn" style="color: var(--accent-green);" onclick="fcNextCard(true)">👍 Ingat</button>
                </div>
            </div>
        </div>

        <!-- VIEW 3: KUIS -->
        <div id="quizView" class="play-card hidden">
            <div class="progress-wrapper">
                <div class="progress-header"><span>Fase 2: Ujian</span><span id="qzProgressTxt">0%</span></div>
                <div class="progress-bg"><div class="progress-fill" id="qzProgressFill" style="width: 0%; background-color: var(--accent-green);"></div></div>
            </div>
            
            <div id="qzVideoContainer"></div>
            <div class="options-grid" id="qzOptionsContainer" style="margin-top: 16px;"></div>
        </div>

        <!-- VIEW 4: HASIL (SKOR) -->
        <div id="resultView" class="play-card hidden" style="justify-content: center;">
            <div class="result-title" id="resTitle">Level Selesai!</div>
            <div class="stars-container" id="resStars">⭐⭐⭐</div>
            <div class="score-text" id="resScore">Akurasi: 100%</div>
            <button class="next-btn" onclick="finishLevel()">Lanjutkan</button>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        // Data Global
        const STORAGE_KEY = 'bisindo_unlocked_level';
        let allWords = [];
        let levelsData = {}; // Format: { 1: [item, item], 2: [item] }
        let highestUnlocked = parseInt(localStorage.getItem(STORAGE_KEY)) || 1;
        
        let currentLevel = 1;
        let currentView = 'map'; // map, flashcard, quiz, result

        // State Sesi
        let fcDeck = [];
        let fcTotal = 0;
        let fcCurrent = null;

        let qzDeck = [];
        let qzTotal = 0;
        let qzCurrent = null;
        let qzMistakes = 0; 
        let hasGuessedWrongInCard = false;

        const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSx8Kb-ezyZdVw46ruREAydDcWtquytEFrWomKc9zdMgOG0dGbElZz8NmVDMGpvgSJmY9fSDV18LVty/pub?output=csv';

        // 1. MEMUAT DATA
        Papa.parse(sheetCsvUrl, {
            download: true,
            header: false,
            skipEmptyLines: true,
            complete: function(results) {
                results.data.forEach(row => {
                    if (!row || !row[0] || row[0].trim() === "") return;
                    let word = row[0].trim();
                    let html = row[1] ? row[1].trim() : "";
                    let isQuiz = row[3] ? row[3].trim().toUpperCase() === "YA" : false;
                    let levelNum = row[7] ? parseInt(row[7].trim()) : null; // Ambil dari Kolom H (Index 7)

                    allWords.push(word);

                    if (levelNum && html.includes('<iframe')) {
                        if (!levelsData[levelNum]) levelsData[levelNum] = [];
                        levelsData[levelNum].push({
                            word: word,
                            rawHtml: html,
                            isQuiz: isQuiz,
                            wrong1: row[4] ? row[4].trim() : null,
                            wrong2: row[5] ? row[5].trim() : null,
                            wrong3: row[6] ? row[6].trim() : null
                        });
                    }
                });

                document.getElementById('loadingMsg').style.display = 'none';
                renderMap();
            }
        });

        // 2. NAVIGASI
        function switchView(viewName) {
            currentView = viewName;
            document.getElementById('mapView').classList.add('hidden');
            document.getElementById('flashcardView').classList.add('hidden');
            document.getElementById('quizView').classList.add('hidden');
            document.getElementById('resultView').classList.add('hidden');
            
            document.getElementById(viewName + 'View').classList.remove('hidden');
            
            if (viewName === 'map') {
                document.getElementById('headerTitle').innerText = 'Peta Kursus';
                document.getElementById('backText').innerText = 'Menu Utama';
            } else {
                document.getElementById('headerTitle').innerText = `Level ${currentLevel}`;
                document.getElementById('backText').innerText = 'Keluar Level';
            }
        }

        function handleBack() {
            if (currentView === 'map') {
                window.location.href = 'index.html';
            } else {
                if(confirm("Keluar dari level ini? Kemajuan kamu di sesi ini akan hilang.")) {
                    switchView('map');
                    renderMap();
                }
            }
        }

        // 3. PETA LEVEL
        function renderMap() {
            const grid = document.getElementById('levelGrid');
            grid.innerHTML = '';
            
            // Cari level tertinggi yang ada di database
            let maxLevelInDb = Math.max(...Object.keys(levelsData).map(n => parseInt(n)), 1);

            for (let i = 1; i <= maxLevelInDb; i++) {
                let btn = document.createElement('div');
                let isUnlocked = i <= highestUnlocked;
                
                btn.className = `level-btn ${isUnlocked ? 'unlocked' : 'locked'}`;
                btn.innerHTML = `<span>Level ${i}</span> <span>${isUnlocked ? '▶' : '🔒'}</span>`;
                
                if (isUnlocked) {
                    btn.onclick = () => startLevel(i);
                }
                grid.appendChild(btn);
            }
        }

        // 4. MEMULAI LEVEL
        function startLevel(lvl) {
            if (!levelsData[lvl] || levelsData[lvl].length === 0) {
                alert("Materi untuk level ini belum tersedia di database.");
                return;
            }
            
            currentLevel = lvl;
            let levelItems = levelsData[lvl];
            
            fcDeck = [];
            qzDeck = [];
            qzMistakes = 0;

            levelItems.forEach(item => {
                fcDeck.push(item);
                if (item.isQuiz) {
                    fcDeck.push(item); // Munculkan 2x di flashcard
                    qzDeck.push(item); // Masukkan ke kuis
                }
            });

            shuffleArray(fcDeck);
            shuffleArray(qzDeck);
            
            fcTotal = fcDeck.length;
            qzTotal = qzDeck.length;

            switchView('flashcard');
            loadNextFc();
        }

        // 5. ALUR FLASHCARD
        function loadNextFc() {
            if (fcDeck.length === 0) {
                if (qzDeck.length > 0) {
                    switchView('quiz');
                    loadNextQz();
                } else {
                    showResult(); // Lulus langsung jika tidak ada soal kuis
                }
                return;
            }

            fcCurrent = fcDeck.shift();
            
            // Update Progress
            let completed = fcTotal - (fcDeck.length + 1);
            let pct = Math.round((completed / fcTotal) * 100);
            document.getElementById('fcProgressFill').style.width = pct + '%';
            document.getElementById('fcProgressTxt').innerText = pct + '%';

            // Reset UI
            document.getElementById('fcWord').innerText = fcCurrent.word;
            document.getElementById('fcShowAnswerBtn').classList.remove('hidden');
            document.getElementById('fcAnswerSection').classList.add('hidden');
            document.getElementById('fcVideoContainer').innerHTML = '';
        }

        function fcShowAnswer() {
            document.getElementById('fcShowAnswerBtn').classList.add('hidden');
            document.getElementById('fcAnswerSection').classList.remove('hidden');
            
            const vData = getFirstVideoParams(fcCurrent.rawHtml);
            document.getElementById('fcVideoContainer').innerHTML = vData ? 
                `<div class="iframe-wrapper">${vData.iframeHtml}</div>` : '<p>Video error</p>';
        }

        function fcNextCard(isRemembered) {
            if (!isRemembered) {
                // Lempar ke belakang kalau lupa
                fcDeck.push(fcCurrent);
            }
            loadNextFc();
        }

        // 6. ALUR KUIS
        function loadNextQz() {
            if (qzDeck.length === 0) {
                showResult();
                return;
            }

            qzCurrent = qzDeck.shift();
            hasGuessedWrongInCard = false;

            // Update Progress
            let completed = qzTotal - (qzDeck.length + 1);
            let pct = Math.round((completed / qzTotal) * 100);
            document.getElementById('qzProgressFill').style.width = pct + '%';
            document.getElementById('qzProgressTxt').innerText = pct + '%';

            // Render Video
            const vData = getFirstVideoParams(qzCurrent.rawHtml);
            document.getElementById('qzVideoContainer').innerHTML = vData ? 
                `<div class="iframe-wrapper">${vData.iframeHtml}</div>
                 <div class="video-actions">
                     <button class="action-btn" onclick="let i=document.querySelector('#qzVideoContainer iframe'); replayVideo(i, ${vData.seconds}, 1);">🔄 Ulangi Video</button>
                 </div>` : '';

            // Generate Pilihan
            let options = generateOptions(qzCurrent);
            let container = document.getElementById('qzOptionsContainer');
            container.innerHTML = '';

            options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span>${opt}</span>`;
                btn.onclick = () => checkQzAnswer(btn, opt === qzCurrent.word);
                container.appendChild(btn);
            });
        }

        function generateOptions(item) {
            let distractors = [];
            if (item.wrong1) distractors.push(item.wrong1);
            if (item.wrong2) distractors.push(item.wrong2);
            if (item.wrong3) distractors.push(item.wrong3);

            let loop = 0;
            while (distractors.length < 3 && loop < 100) {
                let rw = allWords[Math.floor(Math.random() * allWords.length)];
                if (rw !== item.word && !distractors.includes(rw)) distractors.push(rw);
                loop++;
            }

            let finalOpts = [item.word, ...distractors];
            shuffleArray(finalOpts);
            return finalOpts;
        }

        function checkQzAnswer(btn, isCorrect) {
            if (btn.classList.contains('disabled') || btn.classList.contains('correct')) return;

            if (navigator.vibrate) {
                if (isCorrect) navigator.vibrate(100);
                else navigator.vibrate([100, 100, 100]);
            }

            if (isCorrect) {
                btn.classList.add('correct');
                btn.innerHTML += '<span>✅</span>';
                
                document.querySelectorAll('.option-btn').forEach(b => { if (b !== btn) b.classList.add('disabled'); });

                if (hasGuessedWrongInCard) {
                    qzDeck.push(qzCurrent); // Lempar ke belakang kalau tadi sempat salah
                }

                setTimeout(loadNextQz, 1000);
            } else {
                if (!hasGuessedWrongInCard) {
                    hasGuessedWrongInCard = true;
                    qzMistakes++; // Catat kesalahan untuk potong nilai
                }
                btn.classList.add('wrong');
                setTimeout(() => { btn.classList.remove('wrong'); btn.classList.add('disabled'); }, 400);
            }
        }

        // 7. HASIL & SKOR
        function showResult() {
            switchView('result');
            
            // Hitung Akurasi
            let accuracy = 100;
            if (qzTotal > 0) {
                // Konsep: (Total Soal / (Total Soal + Kesalahan)) * 100
                accuracy = Math.round((qzTotal / (qzTotal + qzMistakes)) * 100);
            }

            document.getElementById('resScore').innerText = `Akurasi: ${accuracy}%`;

            // Tentukan Bintang (Warna emas)
            let starsHtml = "";
            let title = "";
            if (accuracy === 100) {
                starsHtml = "⭐⭐⭐"; title = "Luar Biasa!";
            } else if (accuracy >= 75) {
                starsHtml = "⭐⭐<span style='opacity:0.2'>⭐</span>"; title = "Kerja Bagus!";
            } else {
                starsHtml = "⭐<span style='opacity:0.2'>⭐⭐</span>"; title = "Terus Berlatih!";
            }
            
            document.getElementById('resTitle').innerText = title;
            document.getElementById('resStars').innerHTML = starsHtml;

            // Buka Level Berikutnya
            if (currentLevel === highestUnlocked) {
                highestUnlocked++;
                localStorage.setItem(STORAGE_KEY, highestUnlocked);
            }
        }

        function finishLevel() {
            switchView('map');
            renderMap();
        }

        // 8. UTILITAS
        function getFirstVideoParams(rawHtml) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = rawHtml;
            const iframe = tempDiv.querySelector('iframe');
            if (!iframe) return null;

            let src = iframe.getAttribute('src');
            if (src && !src.includes('enablejsapi=1')) {
                src += (src.includes('?') ? '&' : '?') + 'enablejsapi=1';
                iframe.setAttribute('src', src);
            }

            let videoId = null, seconds = 0;
            let vMatch = src.match(/embed\/([a-zA-Z0-9_-]+)/);
            if (vMatch) videoId = vMatch[1];
            let startMatch = src.match(/[?&]start=(\d+)/);
            if (startMatch) seconds = parseInt(startMatch[1]);
            
            return { iframeHtml: iframe.outerHTML, seconds };
        }

        function replayVideo(iframe, seconds, speed = 1) {
            if (!iframe) return;
            let src = iframe.src;
            src = src.replace(/([?&])start=\d+/, '$1').replace(/([?&])autoplay=1/, '$1');
            src = src.replace(/&&/g, '&').replace(/\?&/g, '?');
            iframe.src = src + (src.includes('?') ? '&' : '?') + 'start=' + seconds + '&autoplay=1';
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
    </script>
</body>
</html>
